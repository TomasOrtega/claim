name: Submit a claim
description: Register a public commitment to a private proof.
title: "[Claim] "
body:
  - type: markdown
    attributes:
      value: |
        Attach only `record.json`. Its sole author must be your GitHub username.
        Put coauthors in the proof text before sealing it.
        Keep your proof, salt, encrypted opening and key private and backed up.
  - type: textarea
    id: record
    attributes:
      label: Upload record.json
      description: >-
        This text box accepts file uploads. Drag your record.json file into it;
        GitHub will upload the file and insert a link automatically.
        Attach one file. You do not need to paste its contents.
    validations:
      required: true
