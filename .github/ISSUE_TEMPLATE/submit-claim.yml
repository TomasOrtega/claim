name: Submit a claim
description: Record the SHA-256 hash of a ZIP you keep on your own machine.
title: "[Claim] "
body:
  - type: markdown
    attributes:
      value: |
        Create a ZIP of your work and calculate its SHA-256 hash locally.
        Paste only the 64-character hash below. Keep the ZIP private and backed up.
        The bot will open a PR; its GitHub creation time will be your claim date.
        Each GitHub account can register one claim per UTC day.
  - type: input
    id: sha256
    attributes:
      label: SHA-256
      description: Paste the hash only, without the filename. Do not upload your ZIP.
    validations:
      required: true
