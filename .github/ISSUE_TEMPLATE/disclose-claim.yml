name: Disclose a claim
description: Publish a proof and salt for a registered claim.
title: "[Disclosure] "
body:
  - type: markdown
    attributes:
      value: |
        Attach a ZIP containing only `record.json`, `proof` and `salt` at its root.
        The record identifies your claim. Never include your encryption key.
        **Uploading this ZIP makes the proof and salt public immediately, before review.**
  - type: textarea
    id: disclosure
    attributes:
      label: Disclosure ZIP
      description: Drag your disclosure.zip file here. Attach one file.
    validations:
      required: true
