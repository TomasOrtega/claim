name: Disclose a claim
description: Link a published proof to a registered claim.
title: "[Disclosure] "
body:
  - type: markdown
    attributes:
      value: |
        Publish the original proof in your own public GitHub repository.
        Open the file on GitHub and press `y` to copy a link to its exact commit.
        `claim disclose` prints the claim ID and salt. Never share the encryption key.
  - type: input
    id: claim-id
    attributes:
      label: Claim ID
      description: The 64-character ID of your registered claim.
    validations:
      required: true
  - type: input
    id: proof-url
    attributes:
      label: Proof URL
      description: Paste the file permalink, with a full commit hash instead of a branch name.
      placeholder: https://github.com/your-name/proofs/blob/COMMIT/proof.pdf
    validations:
      required: true
  - type: input
    id: salt
    attributes:
      label: Salt
      description: Paste the 64 lowercase hexadecimal characters printed by claim disclose.
    validations:
      required: true
