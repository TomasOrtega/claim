name: Disclose claim
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claim-intake
  queue: max

jobs:
  disclose:
    if: startsWith(github.event.issue.title, '[Disclosure]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
      - run: uv run --locked python -m claim.issue_pr disclose
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > "$RUNNER_TEMP/claim-error.md" <<EOF
          🤖 AI text below 🤖

          Could not process this disclosure. [View details]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Check the claim ID, public proof link and salt, then open a new issue or ask a maintainer to rerun a failed job.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/claim-error.md"
