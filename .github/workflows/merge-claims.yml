name: Merge claims
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claim-merger
  cancel-in-progress: false

jobs:
  merge:
    name: Merge batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { configureBackoff } = require('./.github/scripts/claims.cjs');
            configureBackoff(github);
            const merge = require('./.github/scripts/merge-claims.cjs');
            const count = await merge({ github, context, core });
            await core.summary.addRaw(`Merged ${count} claim PRs.`).write();
