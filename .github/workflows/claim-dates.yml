name: Claim dates
on:
  push:
    branches: [main]
    paths: ['claims/**/record.json', '.github/workflows/claim-dates.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: claim-dates
  queue: max

jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: registry
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TomasOrtega/claim
          ref: main
          path: tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
      - name: Record new claim dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          claim_date=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          changed=$(uv run --directory tooling --locked python -m claim date-claims "$GITHUB_WORKSPACE/registry" "$GITHUB_SHA" "$claim_date" "$run_url")
          if [ "$changed" = 0 ]; then exit 0; fi
          git -C registry config user.name 'github-actions[bot]'
          git -C registry config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C registry add -- ':(glob)claims/*/date.json'
          git -C registry commit -m 'chore: record claim dates'
          git -C registry pull --rebase origin main
          git -C registry push origin HEAD:main
